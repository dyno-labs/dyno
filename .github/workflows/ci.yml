# Checks the engine and the CLI on every push and pull request on Linux. Run it by hand to add
# macOS: both must give the same result_hash, which the snapshots and parity/golden-hashes.json
# check. The hosted service has its own workflows (cloud.yml, web.yml).
#
# Pull requests from forks always run on GitHub-hosted runners, never on LINUX_RUNNER, so code
# from outside cannot run on a self-hosted machine.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Fail on a stale or missing snapshot instead of writing a new one.
  INSTA_UPDATE: "no"

jobs:
  linux:
    name: Linux
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  licences:
    name: Licences, advisories and notices
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The versions deny.toml, about.toml and about.hbs were written for. The cache keeps them.
      - run: cargo install --locked cargo-deny@0.20.2
      - run: cargo install --locked --features cli cargo-about@0.9.3
      # Advisories, licences, bans and sources of what ships (deny.toml).
      - run: cargo deny check
      # The notices in every release archive must match the dependencies.
      - run: cargo fetch --locked
      - run: cargo about generate --frozen --fail about.hbs --output-file THIRD_PARTY_NOTICES.md
      - run: git diff --exit-code THIRD_PARTY_NOTICES.md

  msrv:
    name: Minimum Rust (1.97)
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-version in Cargo.toml is 1.97, because the oxc parser needs it. This job keeps that true.
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked

  macos:
    name: macOS
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
