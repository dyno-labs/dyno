[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
# Nothing goes to crates.io yet: cargo-dist releases the binary only.
publish = false
# cargo-dist names it in release links.
repository = "https://github.com/dyno-labs/dyno"

[workspace.dependencies]
# Our crates.
dyno-cdp = { path = "crates/dyno-cdp" }
dyno-ios = { path = "crates/dyno-ios" }
dyno-receipt = { path = "crates/dyno-receipt" }
dyno-run = { path = "crates/dyno-run" }
dyno-schema = { path = "crates/dyno-schema" }
dyno-score = { path = "crates/dyno-score" }
dyno-serve = { path = "crates/dyno-serve" }
dyno-static = { path = "crates/dyno-static" }

# Used by the skeleton.
clap = { version = "4.6.7", features = ["derive"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip reads each number as the double nearest to it, as JSON.parse does. Without it a
# number can be one step off, and the canonical JSON of a file that another program wrote, such
# as a receipt, would not be that program's bytes.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
serde_json_canonicalizer = "0.4.1"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.2.1"
ts-rs = "12.0.1"
url = "2.5.9"
# Run ids and game ids. Already in the tree through rmcp.
uuid = { version = "1.29.1", default-features = false, features = ["std"] }

# Test only.
insta = { version = "1.49.0", features = ["json", "redactions"] }
tempfile = "3.27.0"

# The static scan, from docs/design/static-scan.md section 10. oxc changes its API between
# minor versions, so its crates are pinned exactly.
brotli = "9.1.1"
flate2 = "1.1.11"
html5gum = "0.9.1"
imagesize = "0.15.0"
ktx2 = "0.5.0"
memchr = "2.8.3"
oxc_allocator = "=0.157.0"
oxc_ast = "=0.157.0"
oxc_ast_visit = "=0.157.0"
oxc_parser = "=0.157.0"
oxc_semantic = "=0.157.0"
oxc_span = "=0.157.0"
walkdir = "2.5.0"
# Reads deflate zips through flate2. zip's "deflate" feature would switch flate2 to zlib-rs, and
# the fixtures' gzip sizes assume flate2's default miniz_oxide backend. The version is exact: the
# inventory walks every record of the central directory with `zip::unstable::read::ZipIterable`,
# and the crate says that its unstable module can change in any release.
zip = { version = "=9.5.0", default-features = false, features = ["deflate-flate2"] }
# Decodes audio for the stereo and silence analysis. MPL-2.0: its files are used unmodified, and
# THIRD_PARTY_NOTICES.md says where their source is. Only the codecs and containers the audio scan
# reads; symphonia has no Opus decoder.
symphonia = { version = "0.6.1", default-features = false, features = [
  "aac",
  "adpcm",
  "isomp4",
  "mkv",
  "mp3",
  "ogg",
  "pcm",
  "vorbis",
  "wav",
] }

# Planned for later steps. Declared here so parallel work
# does not edit this file. Unused entries are not built.
chromiumoxide_cdp = "0.9.1"
quick-xml = "0.42.0"

# The CDP driver. Raw CDP over one WebSocket, with our own message envelope: the CDP feasibility
# test found that chromiumoxide_types drops the top-level sessionId of flat sessions.
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.54.1", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }

# The served run: a small HTTP server that serves the build and the harness page to a browser on
# the network. Both crates are already in the tree through tungstenite and url.
httparse = "1.10.1"
percent-encoding = "2.3.2"
# `--open-with` stops the browser it started with its whole process group, with no unsafe code.
# Already in the tree through tempfile; this adds its process feature.
rustix = { version = "1.1.6", features = ["process"] }

# `dyno mcp`, the MCP server: the official MCP Rust SDK. Only the server, its
# tool macros and the stdio transport.
rmcp = { version = "3.9.0", default-features = false, features = [
  "macros",
  "server",
  "transport-io",
] }

# `dyno login` and `dyno upload`: a small blocking HTTP client, with rustls for TLS.
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

# The device run of `--device`: it reads an iPhone through usbmuxd or straight over the network,
# with no Xcode. idevice breaks its API at each point release before 0.2, so it is pinned exactly.
# Only the services the run uses, with ring for TLS, which ureq's rustls already brings. plist reads
# the values the phone sends.
idevice = { version = "=0.1.68", default-features = false, features = [
  "core_device",
  "core_device_proxy",
  "device_info",
  "dvt",
  "ring",
  "rsd",
  "syslog_relay",
  "tcp",
  "tunnel_tcp_stack",
  "usbmuxd",
] }
plist = "1.8.0"

# Receipts, `dyno verify` and `dyno receipt`: Ed25519 signatures, base64url and RFC 3339 times.
# All three are already in the tree, so the binary gains no code: ring is the crypto library of
# rustls, which does the TLS of ureq and idevice, and base64 and time come with plist.
# time also writes the date and time of a result's timestamp.
base64 = "0.23.1"
ring = "0.17.14"
time = { version = "0.3.55", features = ["formatting", "parsing"] }

# `dyno link` edits dyno.toml and keeps its comments. From the same project as toml, whose parts
# are already in the tree.
toml_edit = "0.25.19"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The release build cargo-dist makes.
[profile.dist]
inherits = "release"
lto = "thin"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The byte scan compresses every text file with brotli at quality 11 and gzip at level 9. Without
# optimisation the byte tests take twice as long in a debug build.
[profile.dev.package.brotli]
opt-level = 3

[profile.dev.package.alloc-no-stdlib]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

# The audio analysis decodes every fixture sound, which is slow without optimisation.
[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3

[profile.dev.package.symphonia-codec-aac]
opt-level = 3
