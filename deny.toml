# cargo-deny: what the release binary may depend on. Run `cargo deny check`;
# CI runs it on every push. Only what ships is checked: dev-dependencies never reach the binary.

[graph]
exclude-dev = true
all-features = true

[advisories]
# The RustSec advisory database. A crate with an advisory, or a yanked version, is an error.
yanked = "deny"

[licenses]
# Permissive licences only. Our own crates are MIT OR Apache-2.0 and are checked too. A crate
# offered under several licences passes when one is here, so `Apache-2.0 OR GPL-2.0-only`
# (self_cell) and `MIT OR Apache-2.0 OR LGPL-2.1-or-later` (r-efi) are taken under Apache-2.0 or
# MIT.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93
# symphonia decodes audio (design decision R4). MPL-2.0 is file-level copyleft: the binary may use
# its files while they stay unmodified, and THIRD_PARTY_NOTICES.md says where their source is. Only
# these crates may use it.
exceptions = [
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-bundle-mp3" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-codec-aac" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-codec-adpcm" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-codec-pcm" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-codec-vorbis" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-common" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-core" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-format-isomp4" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-format-mkv" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-format-ogg" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-format-riff" },
  { allow = [
    "MPL-2.0",
  ], crate = "symphonia-metadata" },
]

[bans]
# Two majors of one crate build twice; a warning, since the fix is upstream.
multiple-versions = "warn"
wildcards = "deny"
# Our own crates are path dependencies with no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
