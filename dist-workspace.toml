# cargo-dist: release builds of the dyno binary. Binary only: no source tarball, no installers,
# no package registry. A release is a GitHub Release of this repository, made by
# .github/workflows/release.yml when a version tag such as v0.1.0 is pushed (release-pr.yml pushes
# it when the release pull request merges). The release's title and notes are the section of
# CHANGELOG.md for that version. It is as public as the repository. After a change here, run
# `mise run release:generate` to update the workflow, and `dist plan` to check it.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
ci = "github"
# macOS on both chips, and Linux for CI runners and the hosted runner.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
installers = []
install-updater = false
source-tarball = false
publish-jobs = []
# release.yml has one change that dist did not make: `gh release create` gets --verify-tag in
# place of --target "$RELEASE_COMMIT" (docs/releasing.md says why). So dist must not check the
# workflow against what it would write. `mise run release:generate` writes it and makes the change.
allow-dirty = ["ci"]
# The notices for the open source code in the binary go in every archive.
include = ["THIRD_PARTY_NOTICES.md"]
# A pull request only checks the plan; it builds nothing.
pr-run-mode = "plan"
# Pin each action to a commit, as the other workflows do: actions/checkout v6.1.0,
# actions/upload-artifact v7.0.2 and actions/download-artifact v8.0.2, the majors this cargo-dist's
# workflow is written for.
github-action-commits = { "actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803", "actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9", "actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" }
# The plan, global build, host and announce jobs run on the repository's LINUX_RUNNER variable, as
# health.yml and test.yml do: GitHub-hosted when it is not set, and always GitHub-hosted for a pull
# request from a fork, so code from outside never runs on a self-hosted machine. The Linux build
# stays on dist's default runner: its runner goes into the build matrix as data, where GitHub does
# not evaluate ${{ vars.* }}.
github-custom-runners = { global = "${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.LINUX_RUNNER || 'ubuntu-latest' }}" }
