[sprites]
# silence_us = duration_us - union of sprite ranges clipped to the file. duration_us = floor(ticks * 1e6 / tick_rate).
# silence_bp = floor(silence_us * 10000 / duration_us). silence_bytes_48k = floor(decoded_bytes_48k * silence_us / duration_us).

