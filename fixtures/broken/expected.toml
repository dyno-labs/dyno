[duplicates]
# Groups of byte-identical files (same SHA-256), sorted by first path. Empty files never form a group.
# wasted_bytes = (n - 1) * size. decoded_bytes_saved = (n - 1) * gpu_bytes (images) or decoded_bytes_48k (audio).
group_count = 0

[rules]
# Default thresholds are proposals (docs/design/static-scan.md, section Rules). saved_bytes is what the fix text promises.

[rules."audio.pcm_over_budget"]
