[bytes]
# gzip: flate2 level 9, gzip member with a 10 byte header and no name. brotli: quality 11, lgwin 22.
# Compressed sizes exist only for js, css, html and data. They are exact for the pinned crate versions.

[bytes.js]
files = 1
bytes = 478939
gzip_bytes = 142955
brotli_bytes = 119374

[bytes.html]
files = 1
bytes = 235
gzip_bytes = 182
brotli_bytes = 91

[bytes.image]
files = 3
bytes = 83918

[textures]
engine_for_mips = "pixi7"
# gpu_bytes: raster = sum over levels of w * h * 4; Basis (ETC1S, UASTC) = ASTC 4x4 = sum of ceil(w/4) * ceil(h/4) * 16;
# raw KTX2 = sum of level uncompressed lengths. Mips: Pixi v7 power of two images, Spine pages with a MipMap filter, KTX2 and Basis levels.

[[textures.file]]
path = "assets/atlas-1024x1024.png"
status = "estimated"
format = "png"
width = 1024
height = 1024
levels = 11
mips = "pixi7_pow2"
gpu_format = "rgba8"
gpu_bytes = 5592404
astc_bytes = 1398128

[[textures.file]]
path = "assets/panel-1000x600.png"
status = "estimated"
format = "png"
width = 1000
height = 600
levels = 1
mips = "none"
gpu_format = "rgba8"
gpu_bytes = 2400000
astc_bytes = 600000

[[textures.file]]
path = "assets/tile-512x512.jpg"
status = "estimated"
format = "jpeg"
width = 512
height = 512
levels = 10
mips = "pixi7_pow2"
gpu_format = "rgba8"
gpu_bytes = 1398100
astc_bytes = 349552

[textures.total]
status = "estimated"
lo_bytes = 9390504
hi_bytes = 18781008
top5 = ["assets/atlas-1024x1024.png", "assets/panel-1000x600.png", "assets/tile-512x512.jpg"]
not_covered = []

[bundle]
scanned = ["main.js"]
invalid = []

[bundle.versions]
# A missing key means not detected. web_sdk_version is always unsupported: its packages are 0.0.0.
pixi = "7.4.3"
web_sdk = false

[[bundle.render_site]]
file = "main.js"
callee = "new"
antialias = true
antialias_from = "literal"
resolution_milli = 3000
resolution_from = "devicePixelRatio"
preference = "webgl"
modelled_as = "webgl"
auto_density = true
size_from = "resizeTo"
canvas_css = [402, 874]
canvas_backing = [1206, 2622]
canvas_pixels = 3162132
canvas_bytes = 12648528

[bundle.external]
hosts = []
dynamic_host_sites = 0

[duplicates]
# Groups of byte-identical files (same SHA-256), sorted by first path. Empty files never form a group.
# wasted_bytes = (n - 1) * size. decoded_bytes_saved = (n - 1) * gpu_bytes (images) or decoded_bytes_48k (audio).
group_count = 0

[rules]
# Default thresholds are proposals (docs/design/static-scan.md, section Rules). saved_bytes is what the fix text promises.

[rules."audio.pcm_over_budget"]
