[audio]
# decoded_bytes_R = ceil(ticks * R / tick_rate) * channels * 4, for R = 48000 and 24000.

[[audio.file]]
path = "assets/audio/sounds.m4a"
status = "estimated"
container = "mp4"
codec = "aac"
channels = 1
ticks = 132300
tick_rate = 44100
decoded_bytes_48k = 576000
decoded_bytes_24k = 288000
# A sound group is one sound in several formats (same folder and stem, or one Howler src list).
# It counts once, at its largest member. Ties go to the first path.

[[audio.group]]
paths = ["assets/audio/sounds.m4a"]
representative = "assets/audio/sounds.m4a"
channels = 1
decoded_bytes_48k = 576000
decoded_bytes_24k = 288000
silence_bp = 1967

[audio.total]
silence_by_decode_bp = 1967
status = "estimated"
decoded_bytes_48k = 576000
decoded_bytes_24k = 288000
not_covered = []

[sprites]
# silence_us = duration_us - union of sprite ranges clipped to the file. duration_us = floor(ticks * 1e6 / tick_rate).
# silence_bp = floor(silence_us * 10000 / duration_us). silence_bytes_48k = floor(decoded_bytes_48k * silence_us / duration_us).

[[sprites.map]]
source = "assets/audio/sounds.json"
kind = "howler"
status = "estimated"
audio = ["assets/audio/sounds.m4a"]
representative = "assets/audio/sounds.m4a"
sprite_count = 1
duration_us = 3000000
covered_us = 2400000
silence_us = 600000
silence_bp = 2000
silence_bytes_48k = 115200

[textures]
engine_for_mips = "pixi8"
# gpu_bytes: raster = sum over levels of w * h * 4; Basis (ETC1S, UASTC) = ASTC 4x4 = sum of ceil(w/4) * ceil(h/4) * 16;
# raw KTX2 = sum of level uncompressed lengths. Mips: Pixi v7 power of two images, Spine pages with a MipMap filter, KTX2 and Basis levels.

[[textures.file]]
path = "assets/images/bg-1280x720.jpg"
