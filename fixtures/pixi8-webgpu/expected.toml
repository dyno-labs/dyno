[audio]
# decoded_bytes_R = ceil(ticks * R / tick_rate) * channels * 4, for R = 48000 and 24000.

[[audio.file]]
path = "assets/click.mp3"
status = "estimated"
container = "mp3"
codec = "mp3"
channels = 1
ticks = 8820
tick_rate = 44100
decoded_bytes_48k = 38400
decoded_bytes_24k = 19200
# A sound group is one sound in several formats (same folder and stem, or one Howler src list).
# It counts once, at its largest member. Ties go to the first path.

[[audio.group]]
paths = ["assets/click.mp3"]
representative = "assets/click.mp3"
channels = 1
decoded_bytes_48k = 38400
decoded_bytes_24k = 19200
silence_bp = 0

[audio.total]
silence_by_decode_bp = 0
status = "estimated"
decoded_bytes_48k = 38400
decoded_bytes_24k = 19200
not_covered = []

[textures]
engine_for_mips = "pixi8"
# gpu_bytes: raster = sum over levels of w * h * 4; Basis (ETC1S, UASTC) = ASTC 4x4 = sum of ceil(w/4) * ceil(h/4) * 16;
# raw KTX2 = sum of level uncompressed lengths. Mips: Pixi v7 power of two images, Spine pages with a MipMap filter, KTX2 and Basis levels.

[[textures.file]]
path = "assets/frame-1200x800.png"
status = "estimated"
format = "png"
width = 1200
height = 800
levels = 1
mips = "none"
gpu_format = "rgba8"
